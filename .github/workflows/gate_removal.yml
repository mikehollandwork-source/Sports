name: Gate removal

# Rolling out-of-sample test of removing the book-confirm gate. Three variants
# (live / confirm dropped / book dropped entirely), judged on the games removal
# ADDS rather than on totals that share most of their picks, block by block and
# with August held out.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.gate_removal
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Gate removal $(date -u +%Y-%m-%d)" \
            --body-file output/gate_removal.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/gate_removal.md
          if ! git diff --staged --quiet; then
            git commit -m "Gate removal ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
