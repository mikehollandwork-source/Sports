name: Deep dive

# Backfills historical Polymarket price drift (to enlarge the order-book sample)
# then runs the confidence + exhaustive-scan analysis with a permutation null.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  dive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill Polymarket drift (widens the sample)
        continue-on-error: true
        timeout-minutes: 45
        run: python -m src.pm_backfill

      - name: Run deep dive
        run: python -m src.deep_dive

      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Deep dive $(date -u +%Y-%m-%d)" \
            --body-file output/deep_dive.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/deep_dive.md output/pm_drift_*.json || true
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Deep dive + PM drift backfill ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi
