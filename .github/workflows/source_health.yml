name: Source health

# Tells a dead data source apart from a quiet slate. Runs after the board, on
# its own schedule and concurrency group, so an outage in the board pipeline
# cannot also take out the thing that would report it.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 16-23 * * *"   # :40 past, noon ET -> 7pm ET
    - cron: "40 0-4 * * *"     # :40 past, 8pm ET -> midnight ET

permissions:
  contents: write

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.source_health
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" || true
          git add output/source_health*.md output/source_health.json
          if ! git diff --staged --quiet; then
            git commit -m "Source health ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
