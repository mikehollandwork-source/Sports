name: Signal sweep

# Every side-naming signal, isolated, BOTH directions, with the vig made
# visible: back and fade on the same games sum to about minus twice the hold,
# so a fade only pays when a signal is wrong by more than the vig.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.signal_sweep
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Signal sweep $(date -u +%Y-%m-%d)" \
            --body-file output/signal_sweep.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/signal_sweep.md
          if ! git diff --staged --quiet; then
            git commit -m "Signal sweep ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
