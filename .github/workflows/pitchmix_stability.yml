name: Pitch-mix stability
# Is HR tilt by pitch family stable year to year? Decides whether the pitch-mix
# term gets built at all. Read-only; caches tallies so reruns are cheap.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m src.pitchmix_stability
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/pitchmix_stability.md output/pitchmix_cache.json
          if ! git diff --staged --quiet; then
            git commit -m "Pitch-mix stability ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
