name: Situational splits

# Who hits with runners on, for one team's lineup. Read-only.
# Run with codes=1 to just print MLB's catalogue of valid sitCodes.
on:
  workflow_dispatch:
    inputs:
      team:
        description: "Full team name, e.g. San Diego Padres"
        required: false
      date:
        description: "Board date (YYYY-MM-DD). Blank = today, US/Eastern."
        required: false
      codes:
        description: "Set to 1 to print MLB's situationCodes catalogue instead"
        required: false

permissions:
  contents: write

jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          SIT_TEAM: ${{ github.event.inputs.team }}
          PICKS_DATE: ${{ github.event.inputs.date }}
          SIT_CODES: ${{ github.event.inputs.codes }}
        run: python -m src.situational
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/situational.md
          if ! git diff --staged --quiet; then
            git commit -m "Situational splits ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
