name: Dogs and line

# Good dogs AND the line moved against them, as a 2x2 rather than one cell - so
# it can be seen whether the combination adds anything or one half carries it.
# Corrected across all 16 cells, split-halved, August held out.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.dogs_and_line
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Dogs and line $(date -u +%Y-%m-%d)" \
            --body-file output/dogs_and_line.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/dogs_and_line.md
          if ! git diff --staged --quiet; then
            git commit -m "Dogs and line ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
