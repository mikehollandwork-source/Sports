name: HR pick

# Ranks the likeliest home run among the hitters on the teams the board picked,
# from counting stats only - no prop odds, no implied probabilities.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD). Blank = today US/Eastern."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rank
        run: python -m src.hr_pick ${{ github.event.inputs.date }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if ! git diff --staged --quiet; then
            git commit -m "HR pick ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
