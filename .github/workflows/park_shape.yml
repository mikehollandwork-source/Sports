name: Park shape
# Does a park's shape add to its HR factor? Read-only.
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m src.park_shape
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/park_shape.md output/park_shape_cache.json
          git diff --staged --quiet || { git commit -m "Park shape"; \
            for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done; }
