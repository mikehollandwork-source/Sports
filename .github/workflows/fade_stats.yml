name: Fade stats

# Do BvP, margin, form and the rest separate winning fades from losing ones?
# Tested per-feature with a max-statistic correction AND by holdout log-loss,
# which scores every fade rather than a cell of them.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the audit reconstructs every committed version of
          # every board, and a shallow clone silently yields one version per
          # file - which would report zero dropped picks and look like a pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.fade_stats
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Fade stats $(date -u +%Y-%m-%d)" \
            --body-file output/fade_stats.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/fade_stats.md
          if ! git diff --staged --quiet; then
            git commit -m "Fade stats ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
