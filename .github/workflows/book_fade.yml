name: Book fade

# Backs the side the Polymarket order book has LESS money on, at prices no worse
# than -150. Reports holdout, bootstrap CI, a market-calibrated p-value and the
# mirror strategy.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run book fade
        run: python -m src.book_fade
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Book fade $(date -u +%Y-%m-%d)" \
            --body-file output/book_fade.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/book_fade.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Book fade report ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi
