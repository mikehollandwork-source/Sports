name: Pitch-type probe
# Do pitch-type splits carry HR for hitters AND pitchers? Read-only diagnostic.
on:
  workflow_dispatch:
    inputs:
      batter: {description: "Batter MLB id", required: false}
      pitcher: {description: "Pitcher MLB id", required: false}
      bname: {description: "Batter name (label)", required: false}
      pname: {description: "Pitcher name (label)", required: false}
      date: {description: "Date to resolve a starter from, if no pitcher id", required: false}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Run
        env:
          PROBE_BATTER: ${{ github.event.inputs.batter }}
          PROBE_PITCHER: ${{ github.event.inputs.pitcher }}
          PROBE_BNAME: ${{ github.event.inputs.bname }}
          PROBE_PNAME: ${{ github.event.inputs.pname }}
          PICKS_DATE: ${{ github.event.inputs.date }}
        run: python -m src.pitchtype_probe
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/pitchtype_probe.md
          if ! git diff --staged --quiet; then
            git commit -m "Pitch-type probe ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
