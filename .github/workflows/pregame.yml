name: Board refresh

# Posts a fresh board to Telegram every hour, ON THE HOUR, all day. GitHub
# throttles high-frequency scheduled crons hard (a "*/5" cron fires once early
# then gets dropped for hours), so we kick HOURLY from ~noon ET through ~1am ET -
# hourly crons fire reliably - and each kick runs a loop that rebuilds the board
# and posts it to Telegram, then sleeps to the NEXT top of the hour and repeats.
# So the board lands on the hour whether the loop is carrying the day or a fresh
# hourly kick just took over. A newer kick cancels the older loop (clean handoff);
# if GitHub ever skips an hourly kick the running loop keeps firing on the hour up
# to ~4.75h, so coverage is self-healing.
# (Cron is UTC and fixed; 16:00 UTC = noon ET during EDT. It shifts an hour under
# EST, which only moves the start ~an hour - harmless.)
on:
  workflow_dispatch:
  schedule:
    - cron: "0 16-23 * * *"   # hourly, noon ET -> 7pm ET
    - cron: "0 0-5 * * *"     # hourly, 8pm ET -> 1am ET (next UTC day)

permissions:
  contents: write

# Newest kick wins: it cancels the running loop and takes over the day. The
# group is keyed on the EVENT so a manual "give me a board now" can never be
# cancelled by a cron that happens to fire a few seconds later - which is
# exactly what killed one on 2026-08-06, leaving the board 6h stale with no
# error surfaced anywhere.
concurrency:
  group: pregame-refresh-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # under the 6h hard cap; the loop below runs ~4.75h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A manual run means "give me a board NOW" - build once, post, exit. It
      # deliberately does not start a loop, so it can't double-post alongside
      # the scheduled one.
      - name: One-shot board (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase -X theirs origin "${{ github.ref_name }}" || true
          python -m src.pregame --telegram
          git add output/
          if ! git diff --staged --quiet; then
            git commit -m "Pre-game refresh, manual ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git pull --rebase -X theirs origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi

      - name: Hourly on-the-hour board post
        if: github.event_name != 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 285*60 ))   # loop for ~4.75h, then the job ends
          while [ "$(date +%s)" -lt "$END" ]; do
            git pull --rebase -X theirs origin "${{ github.ref_name }}" || true
            # POST the board on the hour; rebuild SILENTLY at a lock wake, so
            # a game freezes on fresh data without putting an extra eight
            # boards on the phone. pick_watch still announces withdrawals and
            # changes on every rebuild, including the silent ones.
            if [ "${WAKE_KIND:-hour}" = "lock" ]; then
              python -m src.pregame || echo "pregame errored this tick, continuing"
            else
              python -m src.pregame --telegram || echo "pregame errored this tick, continuing"
            fi
            git add output/
            if ! git diff --staged --quiet; then
              git commit -m "Pre-game refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
              for i in 1 2 3 4; do
                git pull --rebase -X theirs origin "${{ github.ref_name }}" \
                  && git push origin "HEAD:${{ github.ref_name }}" && break
                echo "push retry $i"; sleep 5
              done
            fi
            # Sleep to whichever comes first: the next top of the hour, or two
            # minutes before the next game FREEZES (first pitch - 15 min). A
            # game locks on whatever the last board computed, and on the hourly
            # cadence alone that read was 20-55 minutes old - stale on exactly
            # the two inputs the rule uses, the order book and the line.
            WAKE=$(python -m src.next_wake 2>/dev/null) || WAKE=""
            NEXT=$(echo "$WAKE" | cut -d" " -f1)
            WAKE_KIND=$(echo "$WAKE" | cut -d" " -f2)
            case "$NEXT" in
              ''|*[!0-9]*)      # unreadable: fall back to the top of the hour
                NOW=$(date +%s); NEXT=$(( (NOW/3600 + 1)*3600 )); WAKE_KIND=hour ;;
            esac
            export WAKE_KIND
            NOW=$(date +%s); SLEEP=$(( NEXT - NOW ))
            [ "$SLEEP" -gt 0 ] || SLEEP=60
            [ "$(( NEXT ))" -lt "$END" ] || break   # don't nap past the job's end
            echo "next board at $(date -u -d @${NEXT} +%H:%MZ) (${WAKE_KIND}, sleeping ${SLEEP}s)"
            sleep "$SLEEP"
          done
