name: Handle probe

# Is there a third handle (money %) source? Two sources today, and they must
# agree unanimously, so one disagreement kills gate 1 - that costs 20% of the
# slate and is rising. Probe only: fetches candidates and reports their shape.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.handle_probe
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Hit in wins $(date -u +%Y-%m-%d)" \
            --body-file output/handle_probe.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/handle_probe.md
          if ! git diff --staged --quiet; then
            git commit -m "Handle probe ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
