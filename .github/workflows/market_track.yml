name: Market track
# Settles the logged totals / first-five / strikeout lines against what
# happened. SETTLEMENT ONLY - nothing staked, no ROI, no pick changes.
on:
  workflow_dispatch:
  schedule:
    # 13:10 UTC ~= 9:10am ET, by which point every game from the night before
    # is final. Minute 10 rather than 0: schedules on the hour get delayed.
    - cron: "10 13 * * *"
permissions:
  contents: write
concurrency:
  group: market-track
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m src.market_track
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/market_track.json output/market_track.md output/totals_scores.json output/totals_model_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Market track ($(date -u +%Y-%m-%d))"
            pushed=0
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" \
                && { pushed=1; break; }
              echo "push retry $i"; sleep $((2 ** i))
            done
            [ "$pushed" = 1 ] || { echo "push failed after 4 attempts"; exit 1; }
          fi
