name: CLV

# Closing line value: for every pick, the price when it first appeared on the
# board against the price in the final frozen version. Positive means the
# market came toward us after we bet - which is the only way to tell whether
# the line-against gate buys a discount or walks into a warning. Roughly a
# fifth the variance of ROI, so it is measurable on the sample we have.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the audit reconstructs every committed version of
          # every board, and a shallow clone silently yields one version per
          # file - which would report zero dropped picks and look like a pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.clv
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "CLV $(date -u +%Y-%m-%d)" \
            --body-file output/clv.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/clv.md
          if ! git diff --staged --quiet; then
            git commit -m "CLV ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
