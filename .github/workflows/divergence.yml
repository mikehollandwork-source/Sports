name: Divergence

# When the stat model rates a team far ahead but the market prices them only
# modestly, who is right? Tests the model's DEVIATION from the price rather
# than its level, with fade cells scored against backing the same price range
# irrespective of the model - because fading a -150 favourite just means
# backing a dog, and that has its own baseline.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.divergence
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Divergence $(date -u +%Y-%m-%d)" \
            --body-file output/divergence.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/divergence.md
          if ! git diff --staged --quiet; then
            git commit -m "Divergence ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
