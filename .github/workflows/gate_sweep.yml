name: Gate sweep

# Every gate alone, on the whole pool, no other gate applied - the complement
# of gate_audit's ablation. Side held fixed at the public-majority team, so
# the statistic is PASS minus FAIL, with a day-block bootstrap on the
# difference and a shared-redraw permutation across all gates.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.gate_sweep
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Gate sweep $(date -u +%Y-%m-%d)" \
            --body-file output/gate_sweep.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/gate_sweep.md
          if ! git diff --staged --quiet; then
            git commit -m "Gate sweep ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
