name: Hit in wins

# Which hitter records a hit in almost every game his team wins, with the
# opposing starter, the park and the board's form read beside it. Needs the
# live MLB Stats API, which the dev sandbox firewalls.
on:
  workflow_dispatch:
    inputs:
      team:
        description: "Team name as the board writes it (e.g. New York Yankees)"
        required: false
        default: "Cleveland Guardians"
      date:
        description: "Board date (YYYY-MM-DD); blank = today, US/Eastern"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        env:
          TEAM: ${{ inputs.team }}
          BOARD_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BOARD_DATE" ]; then
            python -m src.hit_in_wins --team "$TEAM" --date "$BOARD_DATE"
          else
            python -m src.hit_in_wins --team "$TEAM"
          fi
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Hit in wins $(date -u +%Y-%m-%d)" \
            --body-file output/hit_in_wins.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/hit_in_wins.md
          if ! git diff --staged --quiet; then
            git commit -m "Hit in wins ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
