name: Walk forward

# Walk the season forward one day at a time, each day picking the gate
# configuration with the best ROI on games that finished before it. Measures
# what the retuning habit itself earns against simply leaving the rule alone -
# the grid search is part of the strategy, so it belongs inside the number.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.walk_forward
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Walk forward $(date -u +%Y-%m-%d)" \
            --body-file output/walk_forward.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/walk_forward.md
          if ! git diff --staged --quiet; then
            git commit -m "Walk forward ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
