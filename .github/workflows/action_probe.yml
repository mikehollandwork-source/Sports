name: Action Network probe

# Confirm the shape of Action Network's public scoreboard JSON, which carries
# ml_away_money / ml_home_money across 30 MLB teams - moneyline handle share,
# full slate, no scraping. Shape check before any parser is written.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run
        run: python -m src.action_probe
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Action Network probe ($(date -u +%Y-%m-%d))" \
            --body-file output/action_probe.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/action_probe.md
          if ! git diff --staged --quiet; then
            git commit -m "Action Network probe ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
