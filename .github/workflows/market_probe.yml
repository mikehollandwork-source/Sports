name: Market probe
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Probe
        env: {THE_ODDS_API_KEY: "${{ secrets.THE_ODDS_API_KEY }}"}
        run: python -m src.market_probe
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/market_probe.md output/odds_credits.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Market probe"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi
