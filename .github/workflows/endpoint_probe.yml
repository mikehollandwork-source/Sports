name: Endpoint probe

# One-shot exploration of Kalshi/Polymarket endpoints that might expose
# cumulative money (volume / open interest) for games already played.
# Prints only - nothing here feeds the board.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        run: python -m src.endpoint_probe
