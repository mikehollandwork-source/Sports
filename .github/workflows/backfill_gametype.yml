name: Backfill game type
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m src.backfill_gametype
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/picks_2026-*.json
          git diff --staged --quiet || { git commit -m "Backfill game_type on saved boards"; \
            for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" \
              && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done; }
