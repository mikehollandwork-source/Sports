name: Totals model
on:
  workflow_dispatch:

permissions:
  contents: write   # the report and the boxscore cache are committed back

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/claude-md-docs-jx2xtz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.totals_model
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/totals_model.md output/totals_model_cache.json output/totals_scores.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Totals model measurement"
            # Same pattern as daily.yml: the pm_books logger pushes to this
            # branch every few minutes, so the rebase has to be INSIDE the loop
            # or every retry races the same stale base and loses. The final
            # `exit 1` matters too - a loop ending on `sleep` returns 0, which
            # is how the first run of this reported success and pushed nothing.
            pushed=0
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" \
                && { pushed=1; break; }
              echo "push retry $i"; sleep $((2 ** i))
            done
            [ "$pushed" = 1 ] || { echo "push failed after 4 attempts"; exit 1; }
          fi
