name: Totals model
on:
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/claude-md-docs-jx2xtz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.totals_model
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin claude/claude-md-docs-jx2xtz || true
          git add output/totals_model.md output/totals_model_cache.json output/totals_scores.json
          git diff --staged --quiet || git commit -m "Totals model measurement"
          for i in 1 2 3 4; do git push origin HEAD:claude/claude-md-docs-jx2xtz && break || sleep $((2**i)); done
