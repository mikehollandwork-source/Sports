name: Road-trip rule

# Records and grades the road-trip rule forward, then scores it against the bar
# fixed on 2026-08-31. If every clause passes it promotes ITSELF: the flag flips,
# Telegram fires, and main.py starts adding its picks to the board. Until then
# it touches nothing.
#
# Runs late morning ET so the previous day's games have settled. The step is
# idempotent and self-healing - a missed day backfills on the next run - so a
# delayed or dropped cron costs nothing.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-fade
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Record and grade
        run: python -m src.road_trip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if ! git diff --staged --quiet; then
            git commit -m "Shadow fade ledger ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
