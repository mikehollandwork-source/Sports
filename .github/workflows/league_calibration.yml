name: League calibration

# Is the market right about every team, or only most of them? Per-team de-vigged
# expected wins against actual, with the 30-team scan corrected by a
# shared-redraw permutation, plus the pooled favourite/dog and trend tests on
# one row per game.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.league_calibration
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "League calibration $(date -u +%Y-%m-%d)" \
            --body-file output/league_calibration.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/league_calibration.md
          if ! git diff --staged --quiet; then
            git commit -m "League calibration ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
