name: Stat price

# Is `advantage_team` worth anything as a favourite, or as a dog? Each price
# band is scored against the NON-stat side at the same prices, so the delta
# isolates the stat model from whatever the band itself did. Corrected for the
# seven-band scan and checked for split-half repeatability.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.stat_price
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Stat price $(date -u +%Y-%m-%d)" \
            --body-file output/stat_price.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/stat_price.md
          if ! git diff --staged --quiet; then
            git commit -m "Stat price ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
