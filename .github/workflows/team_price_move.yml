name: Team price move

# Team x price x line movement. The full grid is decoration - both parent
# grids are already null, so crossing them multiplies cells not evidence. The
# real test is whether team identity inside "line against" repeats across
# random halves, which the original team report never asked.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.team_price_move
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Hit in wins $(date -u +%Y-%m-%d)" \
            --body-file output/team_price_move.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/team_price_move.md
          if ! git diff --staged --quiet; then
            git commit -m "Team price move ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
