name: League probe

# Discover a league's teams and identifiers from the venues themselves.
on:
  workflow_dispatch:
    inputs:
      sport:
        description: "sport key (wnba, nba, nhl, nfl, mlb)"
        required: true
        default: "wnba"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python -m src.league_probe "${{ inputs.sport }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/league_probe_*.md
          if ! git diff --staged --quiet; then
            git commit -m "League probe: ${{ inputs.sport }} ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
