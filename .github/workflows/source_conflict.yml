name: Source conflict

# Tests whether fading the Scores&Odds public side works better when the
# public-% sources disagree with each other.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  conflict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run filter check
        continue-on-error: true
        run: python -m src.filter_check
      - name: Run source conflict
        run: python -m src.source_conflict
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Source conflict $(date -u +%Y-%m-%d)" \
            --body-file output/source_conflict.md
          if [ -f output/filter_check.md ]; then
            gh issue create --title "Filter check $(date -u +%Y-%m-%d)" --body-file output/filter_check.md
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/source_conflict.md output/filter_check.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Source conflict report ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi
