name: Batting trend

# Short-window batting trend for one team, hitter by hitter. Read-only.
on:
  workflow_dispatch:
    inputs:
      team:
        description: "Full team name, e.g. Atlanta Braves"
        required: false
        default: "Atlanta Braves"
      date:
        description: "Board date (YYYY-MM-DD). Blank = today, US/Eastern."
        required: false
      window:
        description: "Games in the window (default 3)"
        required: false
        default: "3"

permissions:
  contents: write

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        env:
          TREND_TEAM: ${{ github.event.inputs.team }}
          TREND_WINDOW: ${{ github.event.inputs.window }}
          PICKS_DATE: ${{ github.event.inputs.date }}
        run: python -m src.trend
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/trend.md
          if ! git diff --staged --quiet; then
            git commit -m "Batting trend ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
