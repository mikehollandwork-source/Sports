name: Schedule spots backtest

# Road-trip length, rest and schedule density, derived from board history.
# A different kind of bet from the other signals: not 'we know the teams better'
# but 'the market underweights fatigue'. Max-statistic corrected like the rest.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.schedule_spots
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Schedule spots backtest $(date -u +%Y-%m-%d)" \
            --body-file output/schedule_spots.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/schedule_spots.md
          if ! git diff --staged --quiet; then
            git commit -m "Schedule spots backtest ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
