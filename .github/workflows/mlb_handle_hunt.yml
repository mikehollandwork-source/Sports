name: MLB handle hunt

# Retry the free-handle-source hunt with a browser User-Agent and real status
# codes. The first attempt sent the project's bot UA and reported every failure
# as "blocked", confusing how we ask with what is there.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run
        run: python -m src.mlb_handle_hunt
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "MLB handle hunt ($(date -u +%Y-%m-%d))" \
            --body-file output/mlb_handle_hunt.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/mlb_handle_hunt.md
          if ! git diff --staged --quiet; then
            git commit -m "MLB handle hunt ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
