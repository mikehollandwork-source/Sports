name: Source agreement backtest

# Do all our side-reads point the same way, and is disagreement a signal?
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run source agreement backtest
        run: python -m src.source_agreement
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Source agreement $(date -u +%Y-%m-%d)" \
            --body-file output/source_agreement.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/source_agreement.md
          if ! git diff --staged --quiet; then
            git commit -m "Source agreement backtest ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
