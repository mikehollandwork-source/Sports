name: Parlay structure
# Read-only. Stakes nothing, changes no pick, enters no ledger.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m src.parlay_structure
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/parlay_structure.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Parlay structure measurement"
            pushed=0
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" \
                && { pushed=1; break; }
              echo "push retry $i"; sleep $((2 ** i))
            done
            [ "$pushed" = 1 ] || { echo "push failed"; exit 1; }
          fi
