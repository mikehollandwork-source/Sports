name: Rule tuning

# Sweeps the live rule's own four thresholds against the historical boards and
# order-book logs. Not a new signal - the gates already doing the selecting,
# asked whether they are tuned. Live config is the baseline; max-stat corrected.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Rank
        run: python -m src.rule_tuning
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if ! git diff --staged --quiet; then
            git commit -m "Rule tuning ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
