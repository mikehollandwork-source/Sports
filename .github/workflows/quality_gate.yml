name: Quality gate

# Does the consensus side being better ON RECORD add anything? The first
# candidate this season to survive a price control twice. Tested on every
# qualifying game, within price bands, across time, and split-half.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.quality_gate
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Hit in wins $(date -u +%Y-%m-%d)" \
            --body-file output/quality_gate.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/quality_gate.md
          if ! git diff --staged --quiet; then
            git commit -m "Quality gate ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
