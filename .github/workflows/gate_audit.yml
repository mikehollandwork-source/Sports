name: Gate audit

# Ablation on each gate: the games it UNIQUELY rejects, and whether those games
# are consistently worse than the picks it lets through - overall and month by
# month, so a gate that worked for three weeks and stopped is visible.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the audit reconstructs every committed version of
          # every board, and a shallow clone silently yields one version per
          # file - which would report zero dropped picks and look like a pass
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.gate_audit
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Gate audit $(date -u +%Y-%m-%d)" \
            --body-file output/gate_audit.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/gate_audit.md
          if ! git diff --staged --quiet; then
            git commit -m "Gate audit ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
