name: Taker flow backtest

# Aggressive pre-game money per side, from Kalshi trade history - the direct
# read of "which side is the money on", vs volume's both-sides-of-every-trade.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run taker flow backtest
        run: python -m src.taker_flow
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Taker flow backtest $(date -u +%Y-%m-%d)" \
            --body-file output/taker_flow.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/taker_flow.md
          if ! git diff --staged --quiet; then
            git commit -m "Taker flow backtest ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
