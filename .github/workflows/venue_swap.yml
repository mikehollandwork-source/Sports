name: Venue swap

# Is the book-confirm gate worthless, or fed by the wrong venue? Kalshi tracks
# the sportsbook to under 2c; Polymarket misses by 20c in a fifth of games. Same
# gate, both venues, side held fixed, PASS minus FAIL.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.venue_swap
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Venue swap $(date -u +%Y-%m-%d)" \
            --body-file output/venue_swap.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/venue_swap.md
          if ! git diff --staged --quiet; then
            git commit -m "Venue swap ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
