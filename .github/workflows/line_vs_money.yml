name: Line vs money

# Tests line movement against handle, tickets and Polymarket money - the
# "reverse line move / someone knows something" family of tells.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  lvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run line vs money
        run: python -m src.line_vs_money
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Line vs money $(date -u +%Y-%m-%d)" \
            --body-file output/line_vs_money.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/line_vs_money.md
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Line vs money report ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              echo "push retry $i"; sleep 5
            done
          fi
