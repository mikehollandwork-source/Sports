name: Venue cross

# Every side both markets can name, crossed, and the opposite of each. Where the
# venues split, take-Kalshi and take-Polymarket are the same bet inverted, so
# those cells sum to the double hold by construction - printed to show it.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.venue_cross
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Venue cross $(date -u +%Y-%m-%d)" \
            --body-file output/venue_cross.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/venue_cross.md
          if ! git diff --staged --quiet; then
            git commit -m "Venue cross ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
