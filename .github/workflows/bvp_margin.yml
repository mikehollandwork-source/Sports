name: BvP and margin backtest

# BvP and the stat-edge margin, alone and combined, crossed with line movement
# in both directions. Every cell enters one max-statistic permutation so the
# reported p is corrected for the whole grid.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run
        run: python -m src.bvp_margin
      - name: Post results issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "BvP and margin backtest $(date -u +%Y-%m-%d)" \
            --body-file output/bvp_margin.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/bvp_margin.md
          if ! git diff --staged --quiet; then
            git commit -m "BvP and margin backtest ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4; do
              git pull --rebase origin "${{ github.ref_name }}" \
                && git push origin "HEAD:${{ github.ref_name }}" && break
              sleep 5
            done
          fi
